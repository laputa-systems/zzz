name: build

on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-linux-musl
            cpu: x86_64_v3
          - arch: aarch64
            target: aarch64-linux-musl
            cpu: cortex_a53

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache zig
        id: cache-zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-0.16.0

      - if: steps.cache-zig.outputs.cache-hit != 'true'
        name: Download zig
        run: curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar xJ

      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - run: zig version

      - name: Build zzz
        run: make TARGET=${{ matrix.target }} CPU=${{ matrix.cpu }}

      - name: Rename binary
        run: mv zzz zzz-linux-musl-static-${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zzz-${{ matrix.arch }}
          path: zzz-linux-musl-static-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Create pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Verify Linux ELF artifacts are fully static
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          command -v readelf >/dev/null
          X86_64_COUNT=0
          AARCH64_COUNT=0
          for binary in dist/**/*; do
            [[ -f "$binary" ]] || continue
            if ! readelf -h "$binary" >/dev/null 2>&1; then
              continue
            fi
            machine=$(readelf -h "$binary" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')
            case "$machine" in
              "Advanced Micro Devices X86-64") X86_64_COUNT=$((X86_64_COUNT + 1)) ;;
              AArch64) AARCH64_COUNT=$((AARCH64_COUNT + 1)) ;;
              *) printf '%s has unsupported ELF machine %s\n' "$binary" "$machine" >&2; exit 1 ;;
            esac
            program_headers=$(readelf -lW "$binary")
            if [[ "$program_headers" == *INTERP* ]]; then
              printf '%s has a dynamic ELF interpreter\n' "$binary" >&2
              exit 1
            fi
            dynamic_section=$(readelf -dW "$binary")
            if [[ "$dynamic_section" == *NEEDED* ]]; then
              printf '%s has a dynamic library dependency\n' "$binary" >&2
              exit 1
            fi
          done
          if [[ "$X86_64_COUNT" -ne 1 || "$AARCH64_COUNT" -ne 1 ]]; then
            printf 'Expected one x86_64 and one aarch64 Linux ELF artifact, found x86_64=%s aarch64=%s\n' "$X86_64_COUNT" "$AARCH64_COUNT" >&2
            exit 1
          fi

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG"
